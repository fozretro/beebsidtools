# Build src.app and publish to GitHub Pages.
# Repo Settings → Pages → Source: GitHub Actions
# Site: https://fozretro.github.io/beebsidtools/

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and build Disc Creator
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          mkdir -p src.player/out
          cp src.player/test/golden/sidpl.o src.player/out/
          cp src.player/test/golden/sidpelk.o src.player/out/
          npm install --prefix src.create
          npm install --prefix src.app
          npm run build:app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src.app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
